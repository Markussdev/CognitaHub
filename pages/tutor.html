<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Tutor | Cognita Hub</title>
  <link rel="icon" type="image/png" href="/assets/logo-icon-transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tutor-shell.css" />
  <style>
    /* Tokens, rail (com drawer mobile), topbar/busca, scrollbar interna e
       drawer genérico vêm de tutor-shell.css (compartilhado com
       atividades.html) — aqui só o que é específico desta página. */

    .home-head { padding: 22px 26px 0; display: flex; align-items: flex-start; gap: 18px; }
    .home-head .mascot { width: 68px; height: 68px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 8px 14px rgba(20,17,98,.2)); }
    .home-head .kicker { font-size: var(--label-sm-size); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: var(--label-sm-tracking); }
    .home-head h1 { margin-top: 6px; font-size: 1.5rem; font-weight: 700; color: var(--brand-deep); letter-spacing: -.01em; }
    .home-head p { margin-top: 6px; color: var(--ink-soft); font-size: .92rem; }

    .home-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .home-stat { padding: 16px 18px; }
    .home-stat .lbl { font-size: var(--label-sm-size); font-weight: 700; text-transform: uppercase; letter-spacing: var(--label-sm-tracking); color: var(--muted); }
    .home-stat .val { margin-top: 9px; font-size: .95rem; font-weight: 700; color: var(--ink); line-height: 1.35; }
    @media (max-width: 720px) { .home-stats { grid-template-columns: 1fr; } }

    .home-list { display: grid; gap: 10px; }
    .home-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      border: 1px solid var(--line); border-radius: var(--r); background: var(--card);
      cursor: pointer; text-align: left; width: 100%; font-family: var(--font);
    }
    .home-item:hover { border-color: var(--line-2); background: rgba(20,17,98,.025); }
    .home-item .av { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(150deg, #1a1670, #540042); color: #fff; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
    .home-item .tx { flex: 1; min-width: 0; }
    .home-item .tx b { display: block; font-size: .94rem; color: var(--ink); }
    .home-item .tx span { font-size: .8rem; color: var(--muted); }
    .home-item svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }

    .shortcut-list { display: grid; gap: 8px; }
    .shortcut-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card);
      cursor: pointer; font-family: var(--font); font-size: .86rem; font-weight: 700;
      color: var(--brand); text-decoration: none; width: 100%; text-align: left;
    }
    .shortcut-item:hover { background: rgba(20,17,98,.045); }
    .shortcut-item svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--muted); }

    
    .profile-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 26px 0; }
    .profile-head .kicker { font-size: var(--label-sm-size); font-weight: 700; text-transform: uppercase; letter-spacing: var(--label-sm-tracking); color: var(--muted); }
    .profile-head h1 { margin-top: 4px; font-size: 1.5rem; font-weight: 700; color: var(--brand-deep); letter-spacing: -.01em; }
    .profile-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: start; padding: 18px 26px 60px; }
    .profile-preview { text-align: center; padding: 28px 22px; }
    .profile-avatar { width: 72px; height: 72px; border-radius: 22px; overflow: hidden; background: linear-gradient(150deg, #1a1670, #540042); color: #fff; display: grid; place-items: center; font-size: 1.3rem; font-weight: 700; flex-shrink: 0; }
    .profile-preview .nm { font-size: 1.15rem; font-weight: 700; color: var(--brand-deep); }
    .profile-preview .rl { margin-top: 3px; font-size: .82rem; color: var(--muted); }
    .profile-preview .quote { margin: 16px 0 6px; padding: 13px 15px; border-radius: var(--r-sm); background: linear-gradient(135deg, rgba(255,168,0,.07) 0%, rgba(20,17,98,.03) 100%); border-left: 3px solid var(--accent); text-align: left; }
    .quote-eyebrow { display: flex; align-items: center; gap: 5px; font-size: var(--label-sm-size); font-weight: 700; text-transform: uppercase; letter-spacing: var(--label-sm-tracking); color: var(--accent); margin-bottom: 7px; }
    .quote-eyebrow svg { width: 11px; height: 11px; flex-shrink: 0; }
    .quote-text { display: block; font-size: .85rem; line-height: 1.55; font-style: italic; color: var(--muted); }
    .quote-text.filled { color: var(--ink); }
    .profile-preview .photo-hint { font-size: .76rem; color: var(--muted); line-height: 1.4; margin-bottom: 14px; }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-photo-row { display: flex; align-items: center; gap: 16px; text-align: left; margin-bottom: 16px; }
    .profile-photo-row strong { font-size: .86rem; color: var(--ink); display: block; margin-bottom: 4px; }
    .profile-chips { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 14px; }
    @media (max-width: 760px) { .profile-grid { grid-template-columns: 1fr; } }

    
    .record {
      margin: var(--sp-6) var(--sp-6) 0; padding: var(--sp-6); border-radius: var(--r-lg);
      background: linear-gradient(160deg, #fffefc, var(--brand-soft) 230%);
      border: 1px solid var(--line);
    }
    .rec-top { display: flex; align-items: flex-start; gap: 18px; }
    .rec-id { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(150deg, #1a1670, #540042); color: #fff; display: grid; place-items: center; font-size: 1.4rem; font-weight: 700; flex-shrink: 0; }
    .rec-main { min-width: 0; flex: 1; }
    .rec-name { font-size: 1.7rem; font-weight: 700; color: var(--brand-deep); line-height: 1; letter-spacing: -.02em; }
    .rec-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .meta-chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border: 1px solid var(--line-2); border-radius: var(--pill); font-size: .76rem; font-weight: 700; color: var(--ink-soft); background: var(--card); }
    .meta-chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .meta-chip .dot.ok { background: var(--ok); }
    .meta-chip .dot.warn { background: var(--warn); }
    .meta-chip .dot.info { background: var(--brand); }
    .rec-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: var(--r-sm); font-family: var(--font); font-size: .84rem; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none; border: none; }
    .btn svg { width: 15px; height: 15px; }
    .btn-accent { background: var(--accent); color: var(--ink); box-shadow: 0 1px 6px rgba(255,168,0,.3); }
    .btn-accent:hover:not(:disabled) { filter: brightness(.97); }
    .btn-accent:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .btn-ghost { background: var(--card); color: var(--brand); border: 1px solid var(--line-2); }
    .btn-brand { background: var(--brand); color: #fff; box-shadow: 0 3px 12px rgba(20,17,98,.22); }
    .btn-brand:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-ghost:hover:not(:disabled) { background: rgba(20,17,98,.04); }
    .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
    /* Destrutivo/atenção — ações que tiram algo de circulação (ex.: Arquivar),
       não uma ação primária nem neutra. Ghost tingido de --bad, não sólido —
       ainda é secundária na hierarquia visual da linha, só sinaliza cuidado. */
    .btn-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(163,18,58,.22); }
    .btn-bad:hover:not(:disabled) { background: rgba(163,18,58,.14); }
    .btn-bad:disabled { opacity: .45; cursor: not-allowed; }
    .btn-sm { height: 32px; padding: 0 12px; font-size: .8rem; }

    /* ── Abas ── */
    .tabs { display: flex; gap: 2px; margin-top: var(--sp-6); border-bottom: 1px solid var(--line); padding: 0 var(--sp-6); position: sticky; top: 0; background: var(--canvas); z-index: 9; overflow-x: auto; }
    .tab { appearance: none; background: none; border: none; font-family: var(--font); font-size: .88rem; font-weight: 700; color: var(--ink-soft); padding: 11px 13px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .tab:hover { color: var(--ink-soft); }
    .tab.active { color: var(--brand); border-bottom-color: var(--brand); }
    .tab .badge { display: inline-block; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--pill); background: rgba(20,17,98,.08); color: var(--brand); font-size: .68rem; line-height: 18px; text-align: center; }

    /* ── Painel ── */
    .panel { padding: var(--sp-6) var(--sp-6) 60px; }
    .panel[hidden] { display: none; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 360px); gap: var(--sp-6); align-items: start; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
    .card--accent { border-left: 3px solid var(--brand); }
    .card--warm { background: linear-gradient(165deg, #fffefb, #fdf9f1); }
    .card--resource { background: var(--brand-soft); border-color: transparent; }
    .card--resource .sg-facts span { border-color: rgba(20,17,98,.16); background: rgba(255,255,255,.55); }
    .card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
    .card-h h3 { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
    .card-h-link { font-size: .78rem; font-weight: 700; text-decoration: none; color: var(--muted); }
    .card-h-link:hover { color: var(--brand); }
    .card-b { padding: var(--sp-2) var(--sp-4) var(--sp-4); }
    .stack { display: grid; gap: var(--sp-4); }

    .kv { display: grid; grid-template-columns: 150px 1fr; gap: 0; }
    .kv > dt { padding: 11px 0; font-size: .82rem; color: var(--muted); font-weight: 700; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .kv > dt:first-of-type, .kv > dt:first-of-type + dd { border-top: none; }
    .kv > dt svg { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
    .kv > dd { padding: 11px 0; font-size: .9rem; color: var(--ink); border-top: 1px solid var(--line); line-height: 1.45; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: var(--pill); background: rgba(20,17,98,.05); color: var(--brand); font-size: .76rem; font-weight: 700; }
    .chip--1 { background: rgba(30,27,122,.10); color: var(--brand); }
    .chip--2 { background: rgba(255,168,0,.18); color: #8a5a00; }
    .chip--3 { background: rgba(46,155,98,.14); color: var(--ok); }

    /* Banner próxima ação */
    .nextbar { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: var(--r); background: linear-gradient(135deg, var(--card), var(--brand-soft) 220%); box-shadow: var(--shadow); }
    .nextbar.tone-warn { border-left-color: var(--warn); background: linear-gradient(135deg, var(--card), var(--warn-soft) 220%); }
    .nextbar.tone-ok { border-left-color: var(--ok); background: linear-gradient(135deg, var(--card), var(--ok-soft) 220%); }
    .nextbar .ico { width: 34px; height: 34px; border-radius: 9px; background: rgba(20,17,98,.07); color: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
    .nextbar.tone-warn .ico { background: var(--warn-soft); color: var(--warn); }
    .nextbar.tone-ok .ico { background: var(--ok-soft); color: var(--ok); }
    .nextbar .ico svg { width: 17px; height: 17px; }
    .nextbar .tx { flex: 1; min-width: 0; }
    .nextbar .lb { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); }
    .nextbar.tone-ok .lb { color: var(--ok); }
    .nextbar.tone-default .lb { color: var(--brand); }
    .nextbar .ti { font-size: .92rem; font-weight: 700; }
    .nextbar .ds { font-size: .8rem; color: var(--muted); }

    /* Atividade sugerida */
    .sg-title { font-size: .98rem; font-weight: 700; }
    .sg-why { font-size: .82rem; color: var(--ink-soft); margin-top: 4px; line-height: 1.45; }
    .sg-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .sg-facts span { font-size: .74rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line-2); border-radius: var(--pill); padding: 2px 8px; }

    /* Feed de atividade */
    .feed { display: grid; }
    .feed-item { display: flex; gap: 11px; padding: 11px 0; border-top: 1px solid var(--line); }
    .feed-item:first-child { border-top: none; }
    .feed-ico { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; }
    .feed-ico svg { width: 14px; height: 14px; }
    .feed-ico.you { background: var(--ok-soft); color: var(--ok); }
    .feed-ico.team { background: rgba(20,17,98,.07); color: var(--brand); }
    .feed-tx { font-size: .85rem; line-height: 1.4; min-width: 0; }
    .feed-tx b { font-weight: 700; }
    .feed-tx .sub { color: var(--muted); display: block; }
    .feed-time { font-size: .74rem; color: var(--muted); margin-left: auto; white-space: nowrap; flex-shrink: 0; }

    /* Resumo — mesa de trabalho (docs/TELA-RESUMO-PAINEL-TUTOR.md) */
    .resumo { display: grid; gap: var(--sp-4); }
    .resumo-pulso { font-size: .82rem; color: var(--muted); font-feature-settings: "tnum"; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 0 2px; }
    .resumo-pulso .sep { opacity: .45; }
    .resumo-decisao .card-b { display: grid; gap: 10px; }
    .resumo-decisao .decisao-ti { font-size: 1rem; font-weight: 700; line-height: 1.45; }
    .resumo-decisao .decisao-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
    .resumo-contexto { margin-bottom: 10px; }
    .resumo-link { font-size: .82rem; color: var(--brand); font-weight: 600; text-decoration: none; display: inline-block; }
    .resumo-link:hover { text-decoration: underline; }
    .resumo-meta { font-size: .82rem; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }

    /* Sessões — linha do tempo + assistente de registro em 3 passos */
    .sw-timeline-inner { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-4); flex-wrap: wrap; }
    .sw-timeline-title { font-size: 1rem; }
    .sw-timeline-sub { margin: 2px 0 0; font-size: .84rem; color: var(--muted); }
    .sw-timeline-list { display: grid; gap: 6px; padding: 0 var(--sp-4) var(--sp-4); }
    .sw-timeline-item { display: flex; gap: 8px; align-items: center; font-size: .84rem; color: var(--ink-soft); }
    .sw-timeline-item svg { width: 14px; height: 14px; color: var(--ok); flex-shrink: 0; }
    .sw-timeline-more { color: var(--muted); }
    .sw-timeline-ok { margin: 0 var(--sp-4) var(--sp-4); }

    .sw-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--sp-6); align-items: start; }
    .sw-main { max-width: 720px; padding: var(--sp-6); display: grid; gap: var(--sp-6); align-content: start; }
    .sw-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); }
    .sw-title { margin: 0; font-size: 1.15rem; }
    .sw-sub { margin: 2px 0 0; font-size: .8rem; color: var(--muted); font-feature-settings: "tnum"; }

    .sw-steps { display: flex; gap: var(--sp-4); flex-wrap: wrap; }
    .sw-step { display: flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; color: var(--muted); }
    .sw-step-dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: var(--rail); color: var(--ink-soft); flex-shrink: 0; }
    .sw-step.is-current { color: var(--ink); }
    .sw-step.is-current .sw-step-dot { background: var(--brand); color: #fff; }
    .sw-step.is-done { color: var(--ok); }
    .sw-step.is-done .sw-step-dot { background: var(--ok-soft); color: var(--ok); }

    .sw-block { display: grid; gap: var(--sp-3); }
    .sw-step2 { display: grid; gap: var(--sp-6); }
    .sw-q { margin: 0; font-size: .95rem; }
    .sw-hint { margin: 0; font-size: .8rem; color: var(--muted); }

    .sw-options { display: grid; gap: 8px; }
    .sw-option { display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--card); color: var(--ink); font-size: .9rem; font-weight: 600; cursor: pointer; }
    .sw-option:hover { border-color: var(--brand); }
    .sw-option.is-selected { border-color: var(--brand); background: var(--brand-soft); }
    .sw-option-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); flex-shrink: 0; }
    .sw-option.is-selected .sw-option-dot { border-color: var(--brand); background: var(--brand); box-shadow: inset 0 0 0 3px var(--card); }

    .sw-exec { cursor: pointer; }
    .sw-exec.is-selected { border-color: var(--brand); background: var(--brand-soft); }
    .sw-exec-state { margin: 0; font-size: .78rem; font-weight: 700; color: var(--muted); }
    .sw-exec.is-selected .sw-exec-state { color: var(--brand); }

    .sw-divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .sw-divider::before, .sw-divider::after { content: ''; height: 1px; background: var(--line); flex: 1; }

    .sw-collapsible summary { cursor: pointer; font-size: .86rem; font-weight: 700; color: var(--brand); }
    .sw-manual-body { display: grid; gap: var(--sp-3); margin-top: var(--sp-3); }
    .sw-compact-row { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
    .sw-compact-row input { width: 150px; }

    .sw-note-hint { display: flex; align-items: center; gap: 6px; margin: 0; font-size: .76rem; color: var(--muted); }
    .sw-note-hint svg { width: 12px; height: 12px; flex-shrink: 0; }

    .sw-review { display: flex; gap: 9px; align-items: flex-start; font-size: .86rem; font-weight: 600; cursor: pointer; }
    .sw-review input { width: 16px; height: 16px; accent-color: var(--brand); margin-top: 2px; flex-shrink: 0; }
    .sw-regen { justify-self: start; }

    .sw-nav { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); border-top: 1px solid var(--line); padding-top: var(--sp-4); }

    .sw-side { padding: var(--sp-4); position: sticky; top: 12px; }
    .sw-side summary { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; }
    .sw-side dl { margin: var(--sp-3) 0 0; display: grid; gap: 10px; }
    .sw-side dt { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .sw-side dd { margin: 2px 0 0; font-size: .88rem; font-weight: 600; }
    .sw-side-hint { margin: var(--sp-3) 0 0; padding-top: var(--sp-3); border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); }

    @media (max-width: 940px) {
      .sw-grid { grid-template-columns: 1fr; }
      .sw-main { max-width: none; padding: var(--sp-4); }
      .sw-side { position: static; }
    }

    /* Atividades — acervo (lista com filtros) + assistente de criação */
    .acervo-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; }
    .acervo-title { margin: 0; font-size: 1.3rem; }
    .acervo-sub { margin: 2px 0 0; font-size: .88rem; color: var(--muted); }

    .acervo-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-chip { font: inherit; font-size: .8rem; font-weight: 700; padding: 6px 12px; border-radius: var(--pill); border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
    .filter-chip:hover { border-color: var(--brand); }
    .filter-chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .filter-chip .num { opacity: .7; margin-left: 5px; }

    .acervo-list { display: grid; gap: var(--sp-2); }
    .acervo-item { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-4); }
    .acervo-emblem { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
    .acervo-tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .acervo-item-title { font-size: .94rem; }
    .acervo-item-meta { margin: 0; font-size: .8rem; color: var(--muted); }
    .acervo-item-status { margin: 2px 0 0; font-size: .78rem; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
    .acervo-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .acervo-empty { margin: 0; padding: var(--sp-4); font-size: .88rem; color: var(--muted); }

    .kebab { position: relative; }
    .kebab-btn { font-weight: 800; letter-spacing: .05em; }
    .kebab-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 150px; background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-sm); box-shadow: 0 8px 24px rgba(45,23,57,.14); padding: 4px; display: grid; }
    .kebab-item { font: inherit; font-size: .84rem; font-weight: 600; text-align: left; padding: 8px 10px; border: none; background: none; border-radius: 7px; cursor: pointer; color: var(--ink); }
    .kebab-item:hover { background: rgba(32,26,102,.06); }
    .kebab-item--bad { color: var(--bad); }

    .aw-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--sp-6); align-items: start; max-width: 1240px; }
    .aw-preview { position: sticky; top: 12px; }
    .aw-exp { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); cursor: pointer; font: inherit; color: var(--ink); }
    .aw-exp:hover:not(:disabled) { border-color: var(--brand); }
    .aw-exp.is-selected { border-color: var(--brand); background: var(--brand-soft); }
    .aw-exp:disabled { opacity: .55; cursor: not-allowed; }
    .aw-exp-emblem { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .aw-exp-tx { display: grid; gap: 2px; min-width: 0; }
    .aw-exp-title { font-size: .95rem; font-weight: 700; }
    .aw-exp-desc { font-size: .8rem; color: var(--muted); font-weight: 400; }
    .aw-review { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.5; }
    .aw-save-row { display: flex; gap: 10px; flex-wrap: wrap; }

    @media (max-width: 1100px) {
      .aw-grid { grid-template-columns: 1fr; }
      .aw-preview { position: static; }
    }

    /* Tabela leve (Sessões) */
    .tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
    .tbl th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .tbl td { padding: 12px; border-bottom: 1px solid var(--line); color: var(--ink); vertical-align: top; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr:hover td { background: rgba(20,17,98,.022); }
    .pill { display: inline-flex; align-items: center; height: 21px; padding: 0 8px; border-radius: var(--pill); font-size: .7rem; font-weight: 700; }
    .pill-ok { background: var(--ok-soft); color: var(--ok); }
    .pill-mid { background: var(--warn-soft); color: var(--warn); }
    .pill-bad { background: var(--bad-soft); color: var(--bad); }
    .tbl-bar { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; border-bottom: 1px solid var(--line); }

    /* ── Ações da linha de atividade preparada (Fazer/Duplicar/Editar/Arquivar) ── */
    .activity-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── Banner de edição no form de composição ── */
    .activity-edit-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--warn-soft); border: 1px solid rgba(179,89,10,.2); border-radius: var(--r-sm); font-size: .82rem; color: var(--warn); font-weight: 700; }
    .activity-edit-banner button { flex-shrink: 0; }

    /* ── Execuções do Modo Criança (pendentes na aba Sessões, histórico na aba Atividades) ── */
    .pending-execucoes { display: grid; gap: 8px; padding: 12px; background: rgba(20,17,98,.03); border: 1px solid var(--line); border-radius: var(--r-sm); }
    .pending-execucoes-label { font-size: var(--label-sm-size); font-weight: 700; text-transform: uppercase; letter-spacing: var(--label-sm-tracking); color: var(--muted); }
    .pending-execucao-item { display: grid; gap: 3px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); }
    .pending-execucao-item strong { font-size: .88rem; }
    .pending-execucao-detalhes { font-size: .78rem; color: var(--ink-soft); }
    .pending-execucao-rodape { font-size: .76rem; color: var(--muted); }
    .pending-execucao-item .btn { justify-self: start; margin-top: 4px; }
    .execucoes-msg { font-size: .82rem; color: var(--muted); padding: 2px; }

    .recent-execucoes-list { display: grid; gap: 8px; }
    .recent-execucao-item { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); }
    .recent-execucao-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .recent-execucao-row strong { font-size: .86rem; }
    .recent-execucao-detalhes { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    /* ── Form de sessão ── */
    .form > summary { display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 16px; cursor: pointer; list-style: none; font-size: .86rem; font-weight: 700; }
    .form > summary::-webkit-details-marker { display: none; }
    .form > summary svg { width: 16px; height: 16px; transition: transform .2s; flex-shrink: 0; }
    .form[open] > summary svg { transform: rotate(180deg); }
    .form-body { padding: 0 var(--sp-4) var(--sp-4); display: grid; gap: var(--sp-3); border-top: 1px solid var(--line); padding-top: var(--sp-4); }
    .lvl { font-size: var(--label-sm-size); font-weight: 700; text-transform: uppercase; letter-spacing: var(--label-sm-tracking); color: var(--muted); }
    .guide { font-size: .82rem; color: var(--ink-soft); line-height: 1.5; padding: 12px; border-radius: var(--r-sm); background: rgba(20,17,98,.03); border-left: 3px solid var(--brand); }
    .guide strong { color: var(--brand); display: block; margin-bottom: 4px; }
    .guide em { display: block; margin-top: 6px; color: var(--ok); font-style: normal; }

    .row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--sp-3); }
    .row3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--sp-3); }
    .field { display: grid; gap: 6px; }
    .field label { font-size: .78rem; font-weight: 700; color: var(--ink-soft); }
    .field input, .field textarea {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: var(--r-sm);
      background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: .88rem;
    }
    .field input:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
    .field textarea { min-height: 78px; resize: vertical; line-height: 1.5; }
    .scale { display: flex; flex-wrap: wrap; gap: 6px; }
    .scale-btn {
      display: inline-flex; align-items: center; height: 30px; padding: 0 10px;
      border: 1px solid var(--line-2); border-radius: var(--pill);
      background: var(--canvas); color: var(--ink-soft);
      font-family: var(--font); font-size: .76rem; font-weight: 700; cursor: pointer;
    }
    .scale-btn:hover { border-color: var(--brand); color: var(--brand); }
    .scale-btn.selected { border-color: var(--brand); background: rgba(20,17,98,.08); color: var(--brand); }
    .scale-btn--ok.selected { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
    .scale-btn--warn.selected { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
    .scale-btn--bad.selected { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
    .scale-btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .scale-btn-lock { width: 11px; height: 11px; margin-right: 5px; flex-shrink: 0; }

    /* ── Slider (config do molde — faixas largas) ── */
    .slider-head { display: flex; align-items: baseline; justify-content: space-between; }
    .slider-value { font-size: 1.15rem; font-weight: 800; color: var(--brand-deep); font-variant-numeric: tabular-nums; }
    .slider-input {
      width: 100%; margin-top: 6px; height: 4px; border-radius: 999px;
      accent-color: var(--brand); cursor: pointer;
    }

    /* ── Pills numeradas (config do molde — faixas curtas) ── */
    .pill-select-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill-num {
      width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--line-2);
      background: var(--canvas); color: var(--ink-soft); font-family: var(--font);
      font-weight: 700; font-size: .82rem; cursor: pointer;
    }
    .pill-num:hover { border-color: var(--brand); color: var(--brand); }
    .pill-num.selected { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* ── Compor + prévia ── */
    .compose-summary {
      font-size: .87rem; color: var(--ink-soft); line-height: 1.55; padding: 12px 15px;
      background: rgba(20,17,98,.03); border-left: 3px solid var(--brand); border-radius: var(--r-sm);
    }
    .compose-summary strong { color: var(--brand-deep); }
    .preview-card-h { display: flex; align-items: center; gap: 7px; }
    .preview-card-h svg { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
    .preview-frame-wrap { padding: 18px 16px; display: flex; justify-content: center; }
    .preview-frame {
      width: 100%; max-width: 300px; height: 540px; border-radius: 22px;
      border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(20,17,98,.12);
      overflow: hidden; background: #fff;
    }
    .preview-frame iframe { width: 100%; height: 100%; border: none; display: block; }

    .family-preview { display: grid; gap: 5px; padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: #fffdf8; }
    .family-preview-label { font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
    .family-preview p { font-size: .84rem; color: var(--ink-soft); line-height: 1.45; }
    .char-count { font-size: .72rem; color: var(--muted); text-align: right; }

    .checklist { list-style: none; display: grid; gap: 7px; }
    .checklist li { display: flex; align-items: flex-start; gap: 9px; }
    .checklist input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; accent-color: var(--brand); cursor: pointer; }
    .checklist label { font-size: .84rem; color: var(--ink-soft); cursor: pointer; line-height: 1.4; }

    .internal-note { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
    /* Texto corrido (frase inteira, "A família nunca tem acesso a esta
       nota") — não é um eyebrow de 1-2 palavras, por isso sem uppercase
       (maiúsculo numa frase inteira piora a leitura). Só o tamanho segue o
       token de label pequena, pelo peso visual equivalente. */
    .internal-note-label { display: flex; align-items: center; gap: 7px; padding: 7px 11px; background: rgba(20,17,98,.04); border-bottom: 1px solid var(--line); font-size: var(--label-sm-size); font-weight: 700; color: var(--muted); }
    .internal-note-label svg { width: 12px; height: 12px; flex-shrink: 0; }
    .internal-note textarea { display: block; width: 100%; padding: 11px; border: none; background: var(--card); color: var(--ink); font-family: var(--font); font-size: .86rem; min-height: 64px; resize: vertical; line-height: 1.5; }
    .internal-note textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }

    .form-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .form-ok { font-size: .86rem; color: var(--ok); font-weight: 700; }
    .form-error { font-size: .86rem; color: var(--bad); font-weight: 700; }
    .locked-note { display: flex; align-items: flex-start; gap: 10px; padding: 13px 16px; font-size: .85rem; color: var(--ink-soft); line-height: 1.5; }
    .locked-note svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; margin-top: 1px; }

    /* Passos de status (onboarding/orientação pendente) */
    .steps { display: grid; gap: 8px; }
    .step { display: flex; gap: 11px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); }
    .step.done { background: var(--ok-soft); border-color: transparent; }
    .step.now  { border-color: var(--brand); }
    .step-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .76rem; font-weight: 700; flex-shrink: 0; border: 1.5px solid var(--line-2); color: var(--muted); }
    .step.done .step-n { background: var(--ok); border-color: var(--ok); color: #fff; }
    .step.now .step-n  { background: var(--brand); border-color: var(--brand); color: #fff; }
    .step b { font-size: .88rem; }
    .step p { font-size: .82rem; color: var(--ink-soft); margin-top: 2px; }

    /* Plano — resumo compacto (o mapa grande vive em trilha.html/css/trilha.css) */
    .plan-progress-label { font-size: var(--label-sm-size); letter-spacing: var(--label-sm-tracking); text-transform: uppercase; font-weight: 700; color: var(--brand); }
    .plan-next { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--rail); }
    .plan-next-label { display: block; font-size: var(--label-sm-size); letter-spacing: var(--label-sm-tracking); text-transform: uppercase; font-weight: 700; color: var(--muted); }
    .plan-next b { display: block; margin-top: 2px; font-size: .92rem; color: var(--ink); }
    .plan-dots { display: flex; align-items: center; margin-top: 14px; }
    .plan-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--line-2); background: var(--card); }
    .plan-dot--concluida { background: var(--ok); border-color: var(--ok); }
    .plan-dot--current { width: 17px; height: 17px; background: var(--accent); border-color: var(--accent); }
    .plan-dot-line { flex: 1; height: 2px; background: var(--line-2); margin: 0 3px; }
    .plan-dot-line--done { background: var(--ok); opacity: .5; }
    .plan-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

    .muted { color: var(--muted); }
    .card-copy { font-size: .87rem; color: var(--ink-soft); line-height: 1.5; }
    .mini { display: grid; gap: 6px; padding-left: 16px; font-size: .85rem; color: var(--ink-soft); line-height: 1.45; }

    
    .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 28px 16px; }
    .empty-state img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(20,17,98,.18)); }
    .empty-state strong { font-size: .9rem; color: var(--ink); }
    .empty-state span { font-size: .82rem; color: var(--muted); max-width: 36ch; line-height: 1.5; }

    
    .status-card { display: flex; gap: 16px; align-items: flex-start; padding: 24px; }
    .status-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
    .status-ico svg { width: 22px; height: 22px; }
    .status-ico.pending { background: var(--warn-soft); color: var(--warn); }
    .status-ico.ok { background: var(--ok-soft); color: var(--ok); }
    .status-ico.info { background: rgba(20,17,98,.07); color: var(--brand); }
    .status-kicker { font-size: var(--label-sm-size); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: var(--label-sm-tracking); }
    .status-title { font-size: 1.25rem; font-weight: 700; color: var(--brand-deep); margin: 5px 0 9px; line-height: 1.15; }
    .status-card > div > p { font-size: .88rem; color: var(--ink-soft); line-height: 1.6; max-width: 56ch; }
    .lib-link { display: inline-block; margin-top: 12px; color: var(--brand); font-weight: 700; font-size: .88rem; text-decoration: none; }
    .lib-link:hover { text-decoration: underline; }

    
    .error-card { text-align: center; padding: 30px 20px; }
    .error-card strong { display: block; font-size: 1rem; color: var(--bad); margin-bottom: 6px; }
    .error-card p { font-size: .88rem; color: var(--ink-soft); margin-bottom: 16px; }

    /* .drawer-backdrop / .support-drawer* vêm de tutor-shell.css. */


    .cmdk {
      position: fixed; top: 14vh; left: 50%; transform: translate(-50%, -8px);
      width: min(560px, 92vw); max-height: 64vh;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: 0 24px 64px rgba(45,23,57,.24);
      z-index: 71; opacity: 0; pointer-events: none; transition: opacity .15s ease, transform .15s ease;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .cmdk.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .cmdk-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .cmdk-input-row svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
    .cmdk-input-row input { flex: 1; border: none; background: none; font-family: var(--font); font-size: .95rem; color: var(--ink); outline: none; }
    .cmdk-input-row .kbd { font-size: .7rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; flex-shrink: 0; }
    .cmdk-results { overflow-y: auto; padding: 8px; }
    .cmdk-group-label { padding: 10px 10px 4px; font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .cmdk-item {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px;
      border: none; background: none; border-radius: var(--r-sm); cursor: pointer;
      font-family: var(--font); font-size: .88rem; color: var(--ink); text-align: left; text-decoration: none;
    }
    .cmdk-item svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
    .cmdk-item:hover { background: var(--brand-soft); color: var(--brand); }
    .cmdk-item:hover svg { color: var(--brand); }
    .cmdk-empty { padding: 26px 18px; text-align: center; color: var(--muted); font-size: .86rem; }
    @media (max-width: 600px) { .cmdk { top: 8vh; max-height: 76vh; } }

    
    .skel { border-radius: var(--r); background: linear-gradient(100deg, #ece9e6 40%, #f4f2f0 50%, #ece9e6 60%); background-size: 200% 100%; animation: shimmer 1.4s ease infinite; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: -100% 50%; } }
    .skel-rec { height: 110px; margin: 22px 26px 0; }
    .skel-panel { height: 220px; margin: 18px 26px; }

@media (max-width: 940px) {
      .app { grid-template-columns: 1fr; }
      /* Rail vira drawer: fora da tela por padrão, desliza pra left:0 via
         .open (JS em tutor.js). width explícito porque position:fixed tira
         o rail do grid — sem isso ele encolheria pro conteúdo. */
      .rail {
        position: fixed; top: 0; left: -280px; width: min(280px, 84vw);
        z-index: 69; transition: left .25s ease;
        box-shadow: 16px 0 36px rgba(45,23,57,.18);
      }
      .rail.open { left: 0; }
      .rail-toggle { display: inline-flex; }
      /* Trava o scroll do conteúdo por trás enquanto o drawer está aberto —
         body já é overflow:hidden por padrão (ver regra base), quem rola de
         verdade é #main-content. */
      body.rail-drawer-open #main-content { overflow: hidden; }
      .cols { grid-template-columns: 1fr; }
      .rec-top { flex-direction: column; }
      .tabs { overflow-x: auto; }
      .row, .row3 { grid-template-columns: 1fr; }
      .panel { padding-left: 16px; padding-right: 16px; }
      .record { margin-left: 16px; margin-right: 16px; padding-left: 16px; padding-right: 16px; }
      .skel-rec, .skel-panel { margin-left: 16px; margin-right: 16px; }
    }
  </style>

<body>
<div class="app">

  <nav class="rail thin-scroll" data-rail id="tutor-rail" aria-label="Navegação do tutor">
    <a class="rail-brand" href="../index.html">
      <div class="rail-mark"><img src="/assets/logo-icon-transparent.png" alt="" /></div>
      <div><b>Cognita Hub</b><small>Tutor</small></div>
    </a>

    <a class="rail-link active" href="#" data-rail-home>
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      Início
    </a>

    <div class="rail-group" data-rail-acomp-group hidden>Acompanhamento</div>
    <div data-rail-child-slot></div>

    <div class="rail-group">Recursos</div>
    <a class="rail-link" href="atividades.html" data-rail-library>
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Biblioteca
    </a>
    <a class="rail-link" href="#" data-rail-sessions hidden>
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-7"/></svg>
      Sessões
    </a>

    <div class="rail-group">Suporte</div>
    <a class="rail-link" href="#" data-rail-team>
      <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      Falar com equipe
    </a>

    <div class="rail-spacer"></div>
    <div class="rail-account">
      <button type="button" class="rail-account-btn" data-rail-profile>
        <div class="av" data-account-avatar aria-hidden="true">?</div>
        <div><div class="nm" data-account-name>Tutor</div><div class="rl">Voluntário</div></div>
      </button>
      <button type="button" data-logout aria-label="Sair da conta">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </nav>

  <div class="rail-backdrop" data-rail-backdrop></div>

  <div class="shell">
    <div class="topbar">
      <button type="button" class="rail-toggle" data-rail-toggle aria-label="Abrir menu" aria-expanded="false" aria-controls="tutor-rail">
        <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
      </button>
      <div class="crumb" data-crumb>Painel do tutor</div>
      <button type="button" class="search" data-cmdk-trigger aria-haspopup="dialog">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        Buscar ou executar ação…
        <span class="kbd">⌘K</span>
      </button>
      <div class="topbar-right">
        <div class="av" data-topbar-avatar aria-hidden="true">?</div>
      </div>
    </div>

    <main id="main-content" class="thin-scroll" data-tutor-state aria-live="polite">
      <div class="skel skel-rec"></div>
      <div class="skel skel-panel"></div>
    </main>
  </div>
</div>

<div hidden>
  <span data-account-email></span>
</div>

<div class="drawer-backdrop" data-support-backdrop></div>
<aside class="support-drawer" data-support-drawer aria-hidden="true" aria-label="Central Cognita">
  <div class="support-drawer-head">
    <div>
      <p class="kicker">Central Cognita</p>
      <h2>Falar com a equipe</h2>
    </div>
    <button class="icon-btn" type="button" data-support-close aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="support-drawer-body thin-scroll" data-support-body></div>
</aside>

<div class="drawer-backdrop" data-cmdk-backdrop></div>
<div class="cmdk" data-cmdk role="dialog" aria-modal="true" aria-label="Busca rápida">
  <div class="cmdk-input-row">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input type="text" data-cmdk-input placeholder="Buscar ou executar ação…" autocomplete="off" />
    <span class="kbd">Esc</span>
  </div>
  <div class="cmdk-results thin-scroll" data-cmdk-results></div>
</div>

<script type="module" src="../js/pages/tutor.js"></script>
</body>
</html>
