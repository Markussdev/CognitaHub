<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel da Família | Cognita Hub</title>
  <link rel="icon" type="image/png" href="../assets/logo-icon-transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tutor-shell.css" />
  <style>
    /* Tokens, rail (com drawer mobile), topbar, scrollbar e drawer genérico
       vêm de tutor-shell.css (compartilhado com tutor.html/atividades.html)
       — aqui só o que é específico do painel da família.

       Tom: leitura calma. A família não opera nada — ela acompanha. Tudo é
       devolutiva, sem termo técnico, com UMA informação principal por card. */
    :root { --baloo: "Baloo 2", var(--font); }

    #main-content { padding-bottom: 72px; }
    .fam-page { width: min(980px, calc(100% - 48px)); margin-inline: auto; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
    .card-pad { padding: 20px 22px; }
    .card-pad .sub { margin-top: 8px; font-size: .88rem; color: var(--ink-soft); line-height: 1.55; }
    .kicker { font-size: var(--label-sm-size); font-weight: 800; text-transform: uppercase; letter-spacing: var(--label-sm-tracking); color: var(--muted); }

    /* ── Cabeçalho da view ── */
    .fam-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 30px 0 22px; flex-wrap: wrap; }
    .fam-head h1 { margin-top: 5px; color: var(--brand-deep); font-family: var(--baloo); font-size: clamp(1.6rem, 2.4vw, 2rem); line-height: 1.1; letter-spacing: -.02em; }
    .fam-head .sub { margin-top: 7px; color: var(--ink-soft); font-size: .92rem; max-width: 56ch; line-height: 1.55; }
    .fam-child-chip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; background: var(--card); }
    .fam-child-chip img { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; border: 1px solid var(--line); }
    .fam-child-chip .tx span { display: block; color: var(--muted); font-size: .66rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .fam-child-chip .tx strong { display: block; color: var(--brand-deep); font-size: .92rem; }

    .fam-stack { display: grid; gap: 16px; }

    /* ── Hero do ciclo ── */
    .fam-hero { border: 1px solid rgba(20,17,98,.14); border-radius: 20px; padding: 22px 24px; background: radial-gradient(circle at 100% 0, rgba(255,168,0,.12), transparent 34%), linear-gradient(135deg, #fffefc, #f3f0ff); }
    .fam-hero-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .fam-pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 11px; border-radius: var(--pill); font-size: .74rem; font-weight: 700; background: var(--card); border: 1px solid var(--line-2); color: var(--ink-soft); }
    .fam-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .fam-pill .dot.ok { background: var(--ok); } .fam-pill .dot.warn { background: var(--warn); } .fam-pill .dot.info { background: var(--brand); }
    .fam-hero h2 { margin-top: 10px; color: var(--brand-deep); font-family: var(--baloo); font-size: 1.3rem; line-height: 1.15; }
    .fam-hero .goal { margin-top: 6px; color: var(--ink-soft); font-size: .9rem; line-height: 1.55; max-width: 64ch; }
    .fam-meses { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
    .fam-meses-bar { flex: 1; max-width: 320px; height: 8px; border-radius: 999px; background: rgba(20,17,98,.1); overflow: hidden; }
    .fam-meses-bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
    .fam-meses span { font-size: .78rem; font-weight: 700; color: var(--ink-soft); font-feature-settings: "tnum"; }

    /* ── Devolutiva do tutor (o coração do Resumo) ── */
    .fam-devolutiva { border-left: 4px solid var(--accent); }
    .fam-devolutiva .quote { margin-top: 10px; color: var(--ink); font-size: 1rem; line-height: 1.65; }
    .fam-devolutiva .who { margin-top: 12px; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: .8rem; font-weight: 700; }
    .fam-devolutiva .who .av { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: .66rem; font-weight: 700; overflow: hidden; flex-shrink: 0; }
    .fam-next { margin-top: 14px; padding: 12px 15px; border-radius: var(--r-sm); background: var(--ok-soft); border-left: 3px solid var(--ok); }
    .fam-next b { display: block; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ok); margin-bottom: 3px; }
    .fam-next p { font-size: .88rem; color: var(--ink-soft); line-height: 1.5; }

    /* ── Duas colunas do Resumo (jornada compacta + tutor) ── */
    .fam-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }

    .fam-jornada-mini .traj { margin-top: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .fam-dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: rgba(20,17,98,.08); color: var(--ink-soft); }
    .fam-dot.done { background: var(--ok-soft); color: var(--ok); }
    .fam-dot.now { background: var(--brand); color: #fff; }
    .fam-link { display: inline-block; margin-top: 12px; color: var(--brand); font-size: .84rem; font-weight: 700; text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; font-family: var(--font); }

    .fam-tutor { display: flex; gap: 12px; align-items: flex-start; }
    .fam-tutor .av { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(150deg, #1a1670, #540042); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .9rem; overflow: hidden; flex-shrink: 0; }
    .fam-tutor .av img { width: 100%; height: 100%; object-fit: cover; }
    .fam-tutor b { display: block; color: var(--ink); font-size: .95rem; }
    .fam-tutor .form { color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .fam-tutor-note { margin-top: 12px; padding: 9px 13px; border-radius: var(--r-sm); background: rgba(20,17,98,.04); font-size: .78rem; color: var(--ink-soft); }

    /* ── Jornada (view completa) ── */
    .fam-banner { padding: 14px 18px; border-radius: var(--r); font-weight: 700; font-size: .92rem; }
    .fam-banner.ok { background: var(--ok-soft); color: var(--ok); }
    .fam-banner.warn { background: var(--warn-soft); color: var(--warn); }
    .fam-modstep { display: flex; flex-wrap: wrap; gap: 8px; }
    .fam-modstep .step { display: flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid var(--line); border-radius: var(--pill); font-size: .84rem; color: var(--muted); background: var(--card); }
    .fam-modstep .step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: rgba(20,17,98,.08); color: var(--ink-soft); flex-shrink: 0; }
    .fam-modstep .step.done { color: var(--ok); border-color: rgba(28,124,84,.3); }
    .fam-modstep .step.done .n { background: var(--ok-soft); color: var(--ok); }
    .fam-modstep .step.now { color: var(--ink); font-weight: 700; border-color: var(--brand); }
    .fam-modstep .step.now .n { background: var(--brand); color: #fff; }
    .fam-missao { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
    .fam-missao:first-child { border-top: none; }
    .fam-missao img { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
    .fam-missao .tx { flex: 1; min-width: 0; font-size: .92rem; color: var(--ink); }
    .fam-missao .st { flex-shrink: 0; font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: var(--pill); }
    .fam-missao .st.done { background: var(--ok-soft); color: var(--ok); }
    .fam-missao .st.now { background: var(--brand-soft); color: var(--brand); }
    .fam-missao .st.wait { background: rgba(20,17,98,.06); color: var(--muted); }

    /* ── Sessões (timeline de devolutivas) ── */
    .fam-sessao { border-left: 4px solid var(--brand-soft); }
    .fam-sessao .when { color: var(--muted); font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .fam-sessao h3 { margin-top: 4px; color: var(--brand-deep); font-family: var(--baloo); font-size: 1.08rem; line-height: 1.2; }
    .fam-sessao .resumo { margin-top: 8px; color: var(--ink); font-size: .93rem; line-height: 1.6; }
    .fam-sessao .chips { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .fam-sessao .chips span { border-radius: 999px; padding: 3px 9px; background: rgba(20,17,98,.055); color: var(--ink-soft); font-size: .72rem; font-weight: 700; }

    /* ── Criança (perfil) ── */
    .fam-perfil-id { display: flex; align-items: center; gap: 16px; }
    .fam-perfil-id .mascote { width: 68px; height: 68px; object-fit: cover; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 4px 14px rgba(20,17,98,.18); }
    .fam-perfil-id h2 { color: var(--brand-deep); font-family: var(--baloo); font-size: 1.4rem; }
    .fam-perfil-id .meta { color: var(--muted); font-size: .84rem; margin-top: 2px; }
    .fam-facts { display: grid; gap: 0; margin-top: 6px; }
    .fam-fact { display: flex; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
    .fam-fact:first-child { border-top: none; }
    .fam-fact dt { flex: 0 0 150px; font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 2px; }
    .fam-fact dd { flex: 1; font-size: .9rem; color: var(--ink); line-height: 1.5; }

    /* ── Estados de cadastro (pré-ciclo) ── */
    .fam-status-steps { display: grid; gap: 0; margin-top: 8px; }
    .fam-status-step { display: flex; gap: 13px; padding: 13px 0; border-top: 1px solid var(--line); align-items: flex-start; }
    .fam-status-step:first-child { border-top: none; }
    .fam-status-step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .74rem; font-weight: 700; background: rgba(20,17,98,.08); color: var(--ink-soft); flex-shrink: 0; }
    .fam-status-step.done .n { background: var(--ok-soft); color: var(--ok); }
    .fam-status-step.now .n { background: var(--brand); color: #fff; }
    .fam-status-step b { display: block; font-size: .9rem; color: var(--ink); }
    .fam-status-step p { font-size: .82rem; color: var(--muted); line-height: 1.45; margin-top: 2px; }

    .fam-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 20px; }
    .fam-empty img { width: 84px; height: 84px; object-fit: contain; opacity: .95; }
    .fam-empty strong { font-size: .95rem; color: var(--ink); }
    .fam-empty span { font-size: .85rem; color: var(--muted); max-width: 40ch; line-height: 1.55; }

    /* ── Responsive ── */
    @media (max-width: 940px) {
      .app { grid-template-columns: 1fr; }
      .rail { position: fixed; top: 0; left: -280px; width: min(280px, 84vw); z-index: 70; box-shadow: 4px 0 24px rgba(45,23,57,.18); transition: left .25s ease; }
      .rail.open { left: 0; }
      .rail-toggle { display: inline-flex; }
      body.rail-drawer-open #main-content { overflow: hidden; }
      .fam-page { width: min(100% - 32px, 720px); }
      .fam-cols { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .fam-page { width: min(100% - 24px, 520px); }
      .fam-head { flex-direction: column; align-items: flex-start; }
      .fam-child-chip { width: 100%; }
      .fam-fact { flex-direction: column; gap: 3px; }
      .fam-fact dt { flex: none; }
    }

    /* Skeleton simples do primeiro carregamento */
    .skel { border-radius: var(--r); background: linear-gradient(100deg, #ece9e6 40%, #f4f2f0 50%, #ece9e6 60%); background-size: 200% 100%; animation: shimmer 1.4s ease infinite; }
    .skel-hero { height: 150px; margin: 30px auto 16px; width: min(980px, calc(100% - 48px)); }
    .skel-panel { height: 220px; margin: 0 auto; width: min(980px, calc(100% - 48px)); }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  </style>
</head>
<body>
<div class="app">

  <nav class="rail thin-scroll" data-rail id="fam-rail" aria-label="Navegação da família">
    <a class="rail-brand" href="../index.html">
      <div class="rail-mark"><img src="../assets/logo-icon-transparent.png" alt="" /></div>
      <div><b>Cognita Hub</b><small>Família</small></div>
    </a>

    <div class="rail-group">Acompanhamento</div>
    <button type="button" class="rail-link active" data-view-link="resumo">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      Início
    </button>
    <button type="button" class="rail-link" data-view-link="jornada">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><path d="M6.6 17.4l3.8-3.8"/><path d="M13.6 10.4l3.8-3.8"/></svg>
      Jornada
    </button>
    <button type="button" class="rail-link" data-view-link="sessoes">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-7"/></svg>
      Sessões
    </button>
    <button type="button" class="rail-link" data-view-link="crianca">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>
      Criança
    </button>

    <div class="rail-group">Suporte</div>
    <button type="button" class="rail-link" data-rail-team>
      <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      Ajuda
    </button>

    <div class="rail-spacer"></div>
    <!-- Identidade estática (sem menu): o antigo "Preferências" era rascunho
         local sem persistência — poda honesta. Alterar dados = falar com a
         equipe (Ajuda). -->
    <div class="rail-account">
      <div class="rail-account-btn" style="cursor: default;">
        <div class="av" data-account-avatar aria-hidden="true">?</div>
        <div><div class="nm" data-account-name>Carregando…</div><div class="rl">Responsável</div></div>
      </div>
      <button class="icon-btn" type="button" data-logout aria-label="Sair">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </nav>
  <div class="rail-backdrop" data-rail-backdrop></div>

  <div class="shell">
    <div class="topbar">
      <button type="button" class="rail-toggle" data-rail-toggle aria-label="Abrir menu" aria-expanded="false" aria-controls="fam-rail">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="crumb" data-crumb>Painel da família</div>
      <div class="topbar-right">
        <div class="av" data-topbar-avatar aria-hidden="true">?</div>
      </div>
    </div>

    <main id="main-content" class="thin-scroll" data-guardian-state aria-live="polite">
      <div class="skel skel-hero"></div>
      <div class="skel skel-panel"></div>
    </main>
  </div>
</div>

<div class="drawer-backdrop" data-support-backdrop></div>
<aside class="support-drawer" data-support-drawer aria-hidden="true" aria-label="Central Cognita">
  <div class="support-drawer-head">
    <div>
      <p class="kicker">Central Cognita</p>
      <h2>Falar com a equipe</h2>
    </div>
    <button class="icon-btn" type="button" data-support-close aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="support-drawer-body thin-scroll" data-support-body></div>
</aside>

<script type="module" src="../js/pages/responsavel.js"></script>
</body>
</html>
