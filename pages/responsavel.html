<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel da Família | Cognita Hub</title>
  <link rel="icon" type="image/png" href="../assets/logo-icon-transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2d1739; --ink-soft: #5b4a58; --muted: #8a8391;
      --canvas: #f7f4ee; --card: #fffefc; --rail: #f4f0f6;
      --brand: #141162; --brand-deep: #3b0a35; --brand-soft: #ece8f8; --accent: #ffa800;
      --ok: #1c7c54; --ok-soft: #e8f2ed;
      --warn: #b3590a; --warn-soft: #fbf0e6;
      --bad: #a3123a; --bad-soft: rgba(163,18,58,.08);
      --line: rgba(32,26,102,.10); --line-2: rgba(32,26,102,.18);
      --shadow: 0 1px 2px rgba(45,23,57,.06);
      --r: 14px; --r-sm: 10px; --r-lg: 20px; --pill: 999px;
      --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body { font-family: var(--font); color: var(--ink); background: var(--canvas); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
    .num { font-variant-numeric: tabular-nums; }
    a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    [hidden] { display: none !important; }

    .thin-scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .thin-scroll::-webkit-scrollbar { display: none; }

    /* ── App shell (reuso do painel do tutor) ── */
    .app { display: grid; grid-template-columns: 212px 1fr; height: 100vh; }

    .rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 12px; height: 100vh; overflow-y: auto; }
    .rail-brand { display: flex; align-items: center; gap: 9px; padding: 4px 6px 14px; text-decoration: none; }
    .rail-mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; overflow: hidden; }
    .rail-mark img { width: 100%; height: 100%; object-fit: contain; }
    .rail-brand b { font-size: .9rem; letter-spacing: -.01em; color: var(--ink); }
    .rail-brand small { display: block; font-size: .66rem; color: var(--muted); font-weight: 700; }
    .rail-group { font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 14px 8px 6px; }
    .rail-link { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-sm); color: var(--ink-soft); text-decoration: none; font-size: .86rem; font-weight: 700; background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-family: var(--font); }
    .rail-link svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
    .rail-link:hover { background: rgba(32,26,102,.05); }
    .rail-link.active { background: var(--brand-soft); color: var(--brand); }
    .rail-link.active svg { color: var(--brand); }
    .rail-spacer { flex: 1; }
    .rail-account { display: flex; align-items: center; gap: 6px; padding: 8px; border-top: 1px solid var(--line); margin-top: 8px; }
    .rail-account .av { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .72rem; flex-shrink: 0; overflow: hidden; }
    .rail-account .nm { font-size: .8rem; font-weight: 700; line-height: 1.15; color: var(--ink); }
    .rail-account .rl { font-size: .68rem; color: var(--muted); }
    .rail-account button { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 4px; border-radius: 6px; }
    .rail-account button:hover { background: rgba(32,26,102,.07); color: var(--brand); }
    .rail-account button svg { width: 16px; height: 16px; }

    /* ── Shell / topbar ── */
    .shell { display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow: hidden; }
    .topbar { flex-shrink: 0; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 22px; border-bottom: 1px solid var(--line); background: rgba(248,247,246,.85); backdrop-filter: blur(6px); z-index: 10; }
    #main-content { flex: 1; min-height: 0; overflow-y: auto; }
    .crumb { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb b { color: var(--ink); font-weight: 700; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-soft); cursor: pointer; }
    .icon-btn svg { width: 15px; height: 15px; }
    .icon-btn:hover { border-color: var(--brand); color: var(--brand); }
    .topbar-right .av { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .74rem; flex-shrink: 0; overflow: hidden; }
    .av img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

    .btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: var(--r-sm); font-family: var(--font); font-size: .84rem; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none; border: none; }
    .btn svg { width: 15px; height: 15px; }
    .btn-accent { background: var(--accent); color: var(--ink); box-shadow: 0 1px 6px rgba(255,168,0,.3); }
    .btn-accent:hover:not(:disabled) { filter: brightness(.97); }
    .btn-ghost { background: var(--card); color: var(--brand); border: 1px solid var(--line-2); }
    .btn-ghost:hover:not(:disabled) { background: rgba(20,17,98,.04); }
    .btn-sm { height: 32px; padding: 0 12px; font-size: .8rem; }

    .panel { width: min(1120px, 100%); margin: 0 auto; padding: 34px 26px 60px; }
    .panel > .status-hero { margin: 0; }
    .panel > .row { margin-top: 16px; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; align-items: start; }

    /* ── Cabeçalho humano, antes do status ── */
    .family-head { margin-bottom: 18px; }
    .family-head .kicker { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .family-head h1 { margin-top: 4px; font-size: 1.7rem; line-height: 1.1; color: var(--brand-deep); }
    .family-head p:last-child { margin-top: 6px; color: var(--ink-soft); font-size: .95rem; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
    .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .card-h h3 { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
    .card-h-link { font-size: .78rem; font-weight: 700; text-decoration: none; color: var(--muted); }
    .card-h-link:hover { color: var(--brand); }
    .card-b { padding: 12px 16px 16px; }
    .stack { display: grid; gap: 14px; }

    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 0; }
    .kv > dt { padding: 10px 0; font-size: .8rem; color: var(--muted); font-weight: 700; border-top: 1px solid var(--line); }
    .kv > dt:first-of-type, .kv > dt:first-of-type + dd { border-top: none; }
    .kv > dd { padding: 10px 0; font-size: .88rem; color: var(--ink); border-top: 1px solid var(--line); line-height: 1.45; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: var(--pill); background: rgba(20,17,98,.05); color: var(--brand); font-size: .76rem; font-weight: 700; }

    /* ── status-hero (o bloco que mais importa) ── */
    .status-hero {
      display: grid; gap: 18px; padding: 24px 26px; border-radius: var(--r-lg); border: 1px solid var(--line);
      background:
        radial-gradient(circle at 92% 12%, rgba(255,168,0,.14), transparent 32%),
        radial-gradient(circle at 0% 100%, rgba(20,17,98,.08), transparent 36%),
        linear-gradient(160deg, #fffefc 0%, #fbf7ee 100%);
      box-shadow: var(--shadow);
    }
    .hero-main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
    .hero-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: var(--pill); font-size: .78rem; font-weight: 700; }
    .hero-chip svg { width: 14px; height: 14px; }
    .hero-chip.tone-warn { background: var(--warn-soft); color: var(--warn); }
    .hero-chip.tone-ok { background: var(--ok-soft); color: var(--ok); }
    .hero-chip.tone-bad { background: var(--bad-soft); color: var(--bad); }
    .hero-chip.tone-info { background: rgba(20,17,98,.07); color: var(--brand); }
    .hero-title { margin-top: 14px; font-size: 1.35rem; font-weight: 700; color: var(--brand-deep); line-height: 1.25; letter-spacing: -.01em; max-width: 46ch; }
    .hero-desc { margin-top: 8px; font-size: .92rem; color: var(--ink-soft); line-height: 1.55; max-width: 56ch; }
    .hero-meta { margin-top: 10px; font-size: .84rem; color: var(--muted); font-weight: 700; }
    .hero-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

    /* ── "O que acontece agora" ── */
    .next-box { padding: 14px 16px; border-radius: var(--r); background: rgba(255,168,0,.09); border: 1px solid rgba(255,168,0,.22); }
    .next-box b { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); }
    .next-box p { margin-top: 6px; font-size: .86rem; color: var(--ink-soft); line-height: 1.45; }
    .next-box .eta { margin-top: 8px; font-size: .76rem; color: var(--muted); font-weight: 700; }
    @media (max-width: 760px) { .hero-main { grid-template-columns: 1fr; } }

    /* ── Linha do tempo (reusa .step do tutor) ── */
    .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .step { display: flex; gap: 10px; align-items: center; min-height: 72px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: rgba(255,255,255,.62); }
    .step.done { background: var(--ok-soft); border-color: transparent; }
    .step.now { border-color: var(--brand); background: var(--card); }
    .step-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .76rem; font-weight: 700; flex-shrink: 0; border: 1.5px solid var(--line-2); color: var(--muted); }
    .step.done .step-n { background: var(--ok); border-color: var(--ok); color: #fff; }
    .step.now .step-n { background: var(--brand); border-color: var(--brand); color: #fff; }
    .step b { font-size: .82rem; line-height: 1.25; }
    .step p { font-size: .82rem; line-height: 1.25; color: var(--ink-soft); margin-top: 2px; }
    @media (max-width: 760px) { .steps { grid-template-columns: 1fr; } .step { min-height: 0; align-items: flex-start; } }

    /* ── "Enquanto isso": ações curtas ── */
    .action-list { display: grid; gap: 10px; }
    .action-item { display: flex; gap: 10px; padding: 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: rgba(20,17,98,.025); text-decoration: none; color: inherit; font-family: var(--font); text-align: left; cursor: pointer; }
    .action-item:hover { border-color: var(--line-2); background: rgba(20,17,98,.05); }
    .action-item .ico { width: 30px; height: 30px; border-radius: 9px; background: rgba(20,17,98,.07); color: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
    .action-item .ico svg { width: 15px; height: 15px; }
    .action-item strong { display: block; font-size: .86rem; }
    .action-item span { display: block; margin-top: 2px; font-size: .78rem; color: var(--muted); line-height: 1.35; }

    /* ── Tutor-card ── */
    .tutor-card { display: flex; gap: 12px; align-items: flex-start; }
    .tutor-card .av { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(150deg, #1a1670, #540042); color: #fff; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
    .tutor-card .tx b { display: block; font-size: .94rem; color: var(--ink); }
    .tutor-card .tx span { display: block; font-size: .8rem; color: var(--muted); margin-top: 2px; }
    .tutor-note { margin-top: 10px; font-size: .8rem; color: var(--ink-soft); padding: 9px 11px; border-radius: var(--r-sm); background: rgba(20,17,98,.04); border-left: 3px solid var(--brand); }

    /* ── Atividade sugerida ── */
    .sg-title { font-size: .94rem; font-weight: 700; }
    .sg-why { font-size: .82rem; color: var(--ink-soft); margin-top: 4px; line-height: 1.45; }
    .sg-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .sg-facts span { font-size: .74rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line-2); border-radius: var(--pill); padding: 2px 8px; }

    /* ── session-card (resumo para a família — nunca notas internas) ── */
    .session-card { padding: 13px 16px; border-top: 1px solid var(--line); }
    .session-card:first-child { border-top: none; }
    .sc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .sc-date { font-size: .76rem; color: var(--muted); font-weight: 700; }
    .sc-title { font-size: .92rem; font-weight: 700; margin-top: 2px; }
    .sc-summary { font-size: .86rem; color: var(--ink-soft); line-height: 1.5; margin-top: 6px; }
    .sc-next { font-size: .82rem; color: var(--brand); font-weight: 700; margin-top: 6px; }
    .sc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .sc-flag { font-size: .76rem; color: var(--muted); background: none; border: none; cursor: pointer; font-family: var(--font); font-weight: 700; }
    .sc-flag:hover { color: var(--bad); }

    /* ── Progresso qualitativo (sem % como métrica principal) ── */
    .progress-row { display: grid; gap: 14px; }
    .progress-item .pi-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .progress-item .pi-skill { font-size: .88rem; font-weight: 700; }
    .progress-item .pi-label { font-size: .78rem; color: var(--muted); font-weight: 700; }
    .progress-item .pi-bar { margin-top: 6px; height: 6px; border-radius: var(--pill); background: rgba(20,17,98,.08); overflow: hidden; }
    .progress-item .pi-fill { height: 100%; border-radius: var(--pill); background: var(--brand); }
    .progress-note { font-size: .76rem; color: var(--muted); margin-top: 4px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 28px 16px; }
    .empty-state img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(20,17,98,.18)); }
    .empty-state strong { font-size: .9rem; color: var(--ink); }
    .empty-state span { font-size: .82rem; color: var(--muted); max-width: 36ch; line-height: 1.5; }

    /* ── Gaveta "Falar com a equipe" (reuso do tutor) ── */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(45,23,57,.32); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .support-drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(420px, 92vw); background: var(--card); border-left: 1px solid var(--line); box-shadow: -16px 0 36px rgba(45,23,57,.16); z-index: 61; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
    .support-drawer.open { transform: translateX(0); }
    .support-drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .support-drawer-head .kicker { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
    .support-drawer-head h2 { margin-top: 4px; font-size: 1.1rem; font-weight: 700; color: var(--brand-deep); }
    .support-drawer-body { padding: 20px 22px 28px; overflow-y: auto; flex: 1; display: grid; gap: 14px; align-content: start; }
    .support-channel { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); text-decoration: none; color: var(--ink); font-size: .88rem; font-weight: 700; }
    .support-channel:hover { border-color: var(--brand); color: var(--brand); }
    .support-channel svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
    .support-note { font-size: .8rem; color: var(--muted); line-height: 1.5; }
    @media (max-width: 480px) { .support-drawer { width: 100vw; } }

    /* ── Aba Criança: hero + avatar Cognita real (sem foto de criança) ── */
    .avatar-circle { border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 3px solid var(--brand); box-shadow: 0 6px 16px rgba(45,23,57,.18); }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; object-position: center 38%; }

    .child-hero { display: flex; align-items: center; gap: 20px; padding: 24px 26px; border-radius: var(--r-lg); border: 1px solid var(--line); margin-bottom: 16px;
      background: radial-gradient(circle at 90% 10%, rgba(255,168,0,.12), transparent 32%), linear-gradient(160deg, #fffefc 0%, #fbf7ee 100%);
      box-shadow: var(--shadow);
    }
    .child-hero h1 { font-size: 1.4rem; color: var(--brand-deep); }
    .child-hero .meta { font-size: .86rem; color: var(--muted); margin-top: 4px; }

    .fact-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .fact-chip { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: var(--pill); background: rgba(20,17,98,.06); color: var(--brand); font-size: .8rem; font-weight: 700; }

    .trait-list { display: grid; gap: 10px; }
    .trait-item { display: flex; align-items: flex-start; gap: 10px; font-size: .86rem; color: var(--ink-soft); line-height: 1.4; }
    .trait-item .ico { width: 26px; height: 26px; border-radius: 8px; background: rgba(20,17,98,.06); color: var(--brand); display: grid; place-items: center; flex-shrink: 0; }
    .trait-item .ico svg { width: 14px; height: 14px; }
    .card--dificulta { background: linear-gradient(160deg, #fffefc 0%, #faf8f5 100%); }
    .card--dificulta .trait-item .ico { background: rgba(90,74,88,.08); color: var(--muted); }

    .card--focus { background: linear-gradient(160deg, #fffefc 0%, rgba(255,168,0,.06) 100%); border-color: rgba(255,168,0,.24); }

    .avatar-card-body { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
    .avatar-caption { font-size: .82rem; color: var(--muted); max-width: 28ch; line-height: 1.4; }
    .avatar-options { display: flex; gap: 8px; }
    .avatar-option { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; border: 2px solid transparent; cursor: pointer; padding: 0; background: none; flex-shrink: 0; }
    .avatar-option img { width: 100%; height: 100%; object-fit: cover; object-position: center 38%; }
    .avatar-option.selected { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--brand); }
    .avatar-colors { display: flex; gap: 8px; }
    .avatar-color-dot { width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer; padding: 0; }
    .avatar-color-dot.selected { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px currentColor; }

    .stub-note { font-size: .78rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }

    .mini { list-style: disc; padding-left: 18px; display: grid; gap: 6px; font-size: .85rem; color: var(--ink-soft); line-height: 1.5; }
    .card-copy { font-size: .87rem; color: var(--ink-soft); line-height: 1.55; }

    @media (max-width: 620px) { .child-hero { flex-direction: column; align-items: flex-start; text-align: left; } }

    /* ── Cabeçalho de aba (Sessões, Relatórios…) ── */
    .section-head { margin-bottom: 18px; }
    .section-head h1 { font-size: 1.3rem; color: var(--brand-deep); }
    .section-head p { margin-top: 4px; color: var(--ink-soft); font-size: .9rem; }

    /* ── Sessões: resumo em mini-cards ── */
    .stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .stat-card { padding: 14px 16px; }
    .stat-card .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
    .stat-card .val { margin-top: 8px; font-size: .92rem; font-weight: 700; color: var(--ink); line-height: 1.35; }
    @media (max-width: 760px) { .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* ── Próxima atualização (barra horizontal) ── */
    .update-bar { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r); background: rgba(255,168,0,.09); border: 1px solid rgba(255,168,0,.22); margin-bottom: 16px; }
    .update-bar .ico { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,168,0,.18); color: var(--warn); display: grid; place-items: center; flex-shrink: 0; }
    .update-bar .ico svg { width: 17px; height: 17px; }
    .update-bar .tx { flex: 1; min-width: 0; }
    .update-bar .tx b { display: block; font-size: .88rem; }
    .update-bar .tx span { font-size: .8rem; color: var(--muted); }
    .update-bar .meta { font-size: .78rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
    @media (max-width: 620px) { .update-bar { flex-wrap: wrap; } .update-bar .meta { width: 100%; } }

    /* ── Sessões registradas: cards clicáveis ── */
    .session-list { display: grid; gap: 12px; }
    .session-card { padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); cursor: pointer; text-align: left; width: 100%; font-family: var(--font); display: block; }
    .session-card:hover { border-color: var(--line-2); }
    .sc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .sc-date { font-size: .76rem; color: var(--muted); font-weight: 700; }
    .sc-title { font-size: .96rem; font-weight: 700; margin-top: 2px; }
    .sc-summary { font-size: .86rem; color: var(--ink-soft); line-height: 1.5; margin-top: 6px; }
    .sc-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .sc-facts span { font-size: .74rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line-2); border-radius: var(--pill); padding: 2px 8px; }
    .sc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .sc-link { font-size: .8rem; font-weight: 700; color: var(--brand); }
    .sc-flag { font-size: .76rem; color: var(--muted); background: none; border: none; cursor: pointer; font-family: var(--font); font-weight: 700; }
    .sc-flag:hover { color: var(--bad); }

    /* ── Detalhe da sessão (gaveta lateral, reusa .support-drawer) ── */
    .session-detail-note { font-size: .88rem; color: var(--ink); line-height: 1.55; padding: 12px 13px; border-radius: var(--r-sm); background: rgba(20,17,98,.04); border-left: 3px solid var(--brand); }

    /* ── Relatórios: seletor de mês ── */
    .section-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .month-picker { display: flex; gap: 6px; flex-wrap: wrap; }
    .month-pill { height: 30px; padding: 0 14px; border-radius: var(--pill); border: 1px solid var(--line-2); background: var(--card); font-size: .8rem; font-weight: 700; color: var(--ink-soft); cursor: pointer; font-family: var(--font); }
    .month-pill:hover { border-color: var(--brand); color: var(--brand); }
    .month-pill.active { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

    /* ── Relatórios: progresso por habilidade (barra horizontal, 1 hue) ── */
    .skill-bars { display: grid; gap: 14px; }
    .skill-bar-item .sb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .skill-bar-item .sb-label { font-size: .88rem; font-weight: 700; }
    .skill-bar-item .sb-status { font-size: .78rem; color: var(--muted); font-weight: 700; }
    .skill-bar-item .sb-track { margin-top: 6px; height: 10px; border-radius: var(--pill); background: rgba(20,17,98,.08); overflow: hidden; }
    .skill-bar-item .sb-fill { height: 100%; border-radius: var(--pill); background: var(--brand); }

    /* ── Relatórios: linha do tempo semanal ── */
    .week-timeline { display: grid; gap: 12px; }
    .week-item { display: flex; gap: 12px; align-items: flex-start; }
    .week-item .week-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: .76rem; font-weight: 700; flex-shrink: 0; }
    .week-item b { font-size: .86rem; }
    .week-item p { font-size: .84rem; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }

    /* ── Relatórios: tipos de apoio (distribuição simples) ── */
    .support-bars { display: grid; gap: 10px; }
    .support-bar-item { display: grid; grid-template-columns: 128px 1fr auto; align-items: center; gap: 10px; }
    .support-bar-item .sup-label { font-size: .82rem; font-weight: 700; color: var(--ink-soft); }
    .support-bar-item .sup-track { height: 8px; border-radius: var(--pill); background: rgba(20,17,98,.08); overflow: hidden; }
    .support-bar-item .sup-fill { height: 100%; border-radius: var(--pill); background: var(--brand); }
    .support-bar-item .sup-count { font-size: .76rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
    @media (max-width: 480px) { .support-bar-item { grid-template-columns: 1fr auto; } .support-bar-item .sup-label { grid-column: 1 / -1; } }

    .card--home-tips { background: linear-gradient(160deg, #fffefc 0%, rgba(28,124,84,.06) 100%); border-color: rgba(28,124,84,.22); }

    /* ── Conta (avatar → menu → gaveta) ── */
    .account-wrap { position: relative; flex: 1; min-width: 0; }
    .rail-account-btn { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: none; padding: 4px; border-radius: 8px; cursor: pointer; text-align: left; font-family: var(--font); }
    .rail-account-btn:hover { background: rgba(32,26,102,.05); }
    .account-menu { position: absolute; bottom: calc(100% + 6px); left: 0; width: 194px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: 0 12px 28px rgba(45,23,57,.18); padding: 6px; display: none; flex-direction: column; gap: 2px; z-index: 40; }
    .account-menu.open { display: flex; }
    .account-menu button { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 8px; border: none; background: none; font-family: var(--font); font-size: .83rem; font-weight: 700; color: var(--ink-soft); cursor: pointer; text-align: left; }
    .account-menu button:hover { background: rgba(20,17,98,.06); color: var(--brand); }
    .account-menu button.danger:hover { color: var(--bad); }
    .account-menu svg { width: 15px; height: 15px; flex-shrink: 0; }

    .field { display: grid; gap: 6px; }
    .field label { font-size: .78rem; font-weight: 700; color: var(--ink-soft); }
    .field input { width: 100%; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: .88rem; }
    .field input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
    .field input:disabled { color: var(--muted); cursor: not-allowed; }

    .skel { border-radius: var(--r); background: linear-gradient(100deg, #ece9e6 40%, #f4f2f0 50%, #ece9e6 60%); background-size: 200% 100%; animation: shimmer 1.4s ease infinite; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: -100% 50%; } }
    .skel-hero { height: 190px; margin: 22px 26px 0; }
    .skel-panel { height: 160px; margin: 18px 26px; }

    @media (max-width: 940px) {
      .app { grid-template-columns: 1fr; }
      .rail { position: fixed; left: -260px; z-index: 50; }
      .row { grid-template-columns: 1fr; }
      .panel { padding-left: 16px; padding-right: 16px; }
      .status-hero { margin-left: 16px; margin-right: 16px; padding: 18px; }
      .skel-hero, .skel-panel { margin-left: 16px; margin-right: 16px; }
    }
  </style>
</head>
<body>
<div class="app">

  <nav class="rail thin-scroll" data-rail aria-label="Navegação da família">
    <a class="rail-brand" href="../index.html">
      <div class="rail-mark"><img src="../assets/logo-icon-transparent.png" alt="" /></div>
      <div><b>Cognita Hub</b><small>Família</small></div>
    </a>

    <button type="button" class="rail-link active" data-rail-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      Início
    </button>
    <button type="button" class="rail-link" data-rail-tab="child">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>
      Criança
    </button>
    <button type="button" class="rail-link" data-rail-tab="sessions">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-7"/></svg>
      Sessões
    </button>
    <button type="button" class="rail-link" data-rail-tab="reports">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Relatórios
    </button>
    <button type="button" class="rail-link" data-rail-tab="activities">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Atividades
    </button>

    <div class="rail-group">Suporte</div>
    <button type="button" class="rail-link" data-rail-team>
      <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      Ajuda
    </button>

    <div class="rail-spacer"></div>
    <div class="rail-account">
      <div class="account-wrap">
        <button type="button" class="rail-account-btn" data-account-trigger aria-haspopup="true" aria-expanded="false">
          <div class="av" data-account-avatar aria-hidden="true">?</div>
          <div><div class="nm" data-account-name>Responsável</div><div class="rl">Responsável</div></div>
        </button>
        <div class="account-menu" data-account-menu role="menu">
          <button type="button" role="menuitem" data-account-open="perfil">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>
            Meu perfil
          </button>
          <button type="button" role="menuitem" data-account-open="preferencias">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Preferências
          </button>
          <button type="button" role="menuitem" class="danger" data-logout>
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Sair
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="shell">
    <div class="topbar">
      <div class="crumb" data-crumb>Painel da família</div>
      <div class="topbar-right">
        <div class="av" data-topbar-avatar aria-hidden="true">?</div>
      </div>
    </div>

    <main id="main-content" class="thin-scroll" data-guardian-state aria-live="polite">
      <div class="skel skel-hero"></div>
      <div class="skel skel-panel"></div>
    </main>
  </div>
</div>

<div hidden>
  <span data-account-email></span>
</div>

<div class="drawer-backdrop" data-support-backdrop></div>
<aside class="support-drawer" data-support-drawer aria-hidden="true" aria-label="Central Cognita">
  <div class="support-drawer-head">
    <div>
      <p class="kicker">Central Cognita</p>
      <h2>Falar com a equipe</h2>
    </div>
    <button class="icon-btn" type="button" data-support-close aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="support-drawer-body thin-scroll" data-support-body></div>
</aside>

<div class="drawer-backdrop" data-account-backdrop></div>
<aside class="support-drawer" data-account-drawer aria-hidden="true" aria-label="Minha conta">
  <div class="support-drawer-head">
    <div>
      <p class="kicker" data-account-drawer-kicker>Minha conta</p>
      <h2 data-account-drawer-title>Meu perfil</h2>
    </div>
    <button class="icon-btn" type="button" data-account-close aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="support-drawer-body thin-scroll" data-account-body></div>
</aside>

<div class="drawer-backdrop" data-session-backdrop></div>
<aside class="support-drawer" data-session-drawer aria-hidden="true" aria-label="Detalhe da sessão">
  <div class="support-drawer-head">
    <div>
      <p class="kicker" data-session-drawer-kicker>Sessão</p>
      <h2 data-session-drawer-title>Detalhe da sessão</h2>
    </div>
    <button class="icon-btn" type="button" data-session-close aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="support-drawer-body thin-scroll" data-session-body></div>
</aside>

<script type="module" src="../js/pages/responsavel.js"></script>
</body>
</html>
