<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Modo Criança | Cognita Hub</title>
  <link rel="icon" type="image/png" href="../assets/logo-icon-transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2d1739; --ink-soft: #5b4a58;
      --paper: #f7f4ee;
      --brand: #141162; --brand-deep: #3b0a35; --accent: #ffa800;
      --ok: #1c7c54; --ok-soft: #e8f2ed;
      --warn: #b3590a; --warn-soft: #fbf0e6;
      --bad: #a3123a; --bad-soft: rgba(163,18,58,.08);
      --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-display: "Baloo 2", var(--font-body);
      --hold-ms: 550ms;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    button { font-family: var(--font-body); }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

    /* trava sensorial: nenhuma transição/animação sobrevive a prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    /* ── Palco (casca) ──
       "Missão calma": glow bem sutil e estático (sem estrelas piscando, sem
       gradiente animado) — a referência é o clima espacial de apps tipo
       Duolingo, mas contido pela mesma trava sensorial de sempre (claro,
       baixa saturação, zero ruído visual, zero movimento fora de foco). */
    .stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 14% 16%, rgba(122,108,255,.11), transparent 42%),
        radial-gradient(circle at 88% 20%, rgba(122,108,255,.07), transparent 34%),
        radial-gradient(circle at 82% 86%, rgba(255,168,0,.07), transparent 38%),
        var(--paper); /* trava sensorial: sempre claro, nunca escuro de alto contraste */
    }

    .stage-top {
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 8px;
    }
    .mascote-mini { width: 52px; height: 52px; }
    .mascote-mini img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 3px 8px rgba(20,17,98,.18)); }

    /* Missão X de Y — só a etiqueta de progresso da rodada atual (prepara a
       linguagem visual de "missão" pra uma trilha futura, sem virar mapa). */
    .mission-badge {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: .82rem;
      color: var(--brand);
      background: #fff;
      border: 1px solid rgba(20,17,98,.12);
      border-radius: 999px;
      padding: 6px 16px;
      white-space: nowrap;
    }

    .adult-btn {
      position: relative;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(20,17,98,.14);
      color: var(--ink-soft);
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .adult-btn svg { width: 20px; height: 20px; }
    .adult-btn-ring { position: absolute; inset: -3px; width: 54px; height: 54px; pointer-events: none; }
    .adult-btn-ring circle {
      fill: none; stroke: var(--accent); stroke-width: 3;
      stroke-dasharray: 119; stroke-dashoffset: 119;
      transform: rotate(-90deg); transform-origin: center;
    }
    .adult-btn.holding .adult-btn-ring circle { transition: stroke-dashoffset var(--hold-ms) linear; stroke-dashoffset: 0; }

    .stage-instruction {
      flex-shrink: 0;
      text-align: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      color: var(--brand-deep);
      padding: 6px 24px 0;
      min-height: 2.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
    }
    .stage-instruction.repeat-pulse { animation: instruction-pulse .9s ease; }
    @keyframes instruction-pulse {
      0%, 100% { background: transparent; }
      35% { background: rgba(255,168,0,.22); }
    }

    .stage-center {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
    }

    .panel { display: none; flex-direction: column; align-items: center; text-align: center; gap: 14px; max-width: 560px; width: 100%; }
    .panel[data-active] { display: flex; }

    .panel-mascote { width: 112px; height: 112px; animation: mascote-entra .4s ease; }
    .panel-mascote img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(20,17,98,.18)); }
    .panel-mascote-rest img { opacity: .82; }
    @keyframes mascote-entra {
      from { transform: translateY(6px) scale(.94); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .panel-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 5vw, 1.7rem); color: var(--brand-deep); line-height: 1.25; }
    .panel-title-sm { font-size: clamp(1.1rem, 4.4vw, 1.3rem); }
    .panel-fala { font-size: 1rem; color: var(--ink-soft); line-height: 1.55; max-width: 42ch; }
    .panel-fala-sm { font-size: .86rem; max-width: 34ch; }

    /* Missão: {nome} — etiqueta curta dentro do acolhimento, junto do
       cumprimento genérico da casca. É o que muda por atividade; o resto do
       texto de boas-vindas fica igual pra toda missão. */
    .mission-pill {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: .95rem;
      color: var(--brand-deep);
      background: rgba(122,108,255,.10);
      border: 1px solid rgba(20,17,98,.12);
      border-radius: 999px;
      padding: 8px 18px;
    }

    /* trava sensorial: a área do molde é o único espaço que o molde controla */
    .mold-slot {
      width: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* sem molde plugado (ou molde não reconhecido): mesmo placeholder de antes,
       só que via :empty — some sozinho assim que um molde popula o slot */
    .mold-slot:empty {
      border: 2px dashed rgba(20,17,98,.22);
      border-radius: 20px;
      background: rgba(20,17,98,.02);
    }
    .mold-slot:empty::before {
      content: 'molde entra aqui';
      color: var(--ink-soft);
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .feedback-icon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; animation: feedback-pop .32s ease; }
    .feedback-icon svg { width: 36px; height: 36px; }
    .feedback-icon.acerto { background: var(--ok-soft); color: var(--ok); }
    .feedback-icon.dificuldade { background: var(--warn-soft); color: var(--warn); }
    @keyframes feedback-pop {
      from { transform: scale(.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .stage-footer {
      flex-shrink: 0;
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 14px 24px calc(env(safe-area-inset-bottom, 0px) + 18px);
    }
    .btn-primary, .btn-secondary {
      min-height: 60px;
      min-width: 140px;
      padding: 0 30px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #3a2400; box-shadow: 0 4px 14px rgba(255,168,0,.32); }
    .btn-secondary { background: #fff; color: var(--ink-soft); border: 1px solid rgba(20,17,98,.16); }

    /* ── Folha do adulto (escondida, aberta só por toque longo) ── */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(35,2,32,.32);
      opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 40;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .adult-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto;
      max-width: 480px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -14px 40px rgba(35,2,32,.18);
      padding: 8px 22px calc(env(safe-area-inset-bottom, 0px) + 22px);
      transform: translateY(105%);
      transition: transform .22s ease;
      z-index: 41;
    }
    .adult-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 4px; background: rgba(20,17,98,.18); border-radius: 99px; margin: 8px auto 14px; }
    .sheet-title { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: var(--brand-deep); text-align: center; }
    .sheet-sub { font-size: .82rem; color: var(--ink-soft); text-align: center; margin-top: 3px; margin-bottom: 14px; }
    .sheet-actions { display: flex; flex-direction: column; gap: 8px; }
    .sheet-action {
      min-height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(20,17,98,.14);
      background: #fff;
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px;
      font-weight: 700;
      font-size: .92rem;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .sheet-action:hover { background: rgba(20,17,98,.04); }
    .sheet-action svg { width: 18px; height: 18px; color: var(--ink-soft); flex-shrink: 0; }
    .sheet-action-bad { color: var(--bad); border-color: rgba(163,18,58,.25); }
    .sheet-action-bad svg { color: var(--bad); }
    .sheet-sep { height: 1px; background: rgba(20,17,98,.1); margin: 6px 0; }
    .sheet-close {
      width: 100%; min-height: 46px; margin-top: 14px;
      background: none; border: none; color: var(--ink-soft);
      font-weight: 700; cursor: pointer;
    }

    /* Confirmação de "Encerrar atividade" — segundo passo dentro da mesma
       folha, pra reduzir saída acidental sem exigir senha. */
    .sheet-confirm { padding-top: 4px; }
    .sheet-confirm-title { font-family: var(--font-display); font-weight: 800; font-size: 1rem; color: var(--brand-deep); text-align: center; }
    .sheet-confirm-sub { font-size: .86rem; color: var(--ink-soft); text-align: center; line-height: 1.5; margin-top: 8px; }
    .sheet-confirm-actions { display: flex; gap: 10px; margin-top: 18px; }
    .sheet-confirm-actions .btn-secondary,
    .sheet-confirm-actions .btn-primary { flex: 1; min-height: 52px; min-width: 0; padding: 0 12px; font-size: .95rem; }
    .sheet-confirm-danger { background: var(--bad); color: #fff; box-shadow: none; }
  </style>
</head>
<body>

  <div class="stage" id="stage" data-state="acolhimento">

    <header class="stage-top">
      <div class="mascote-mini" aria-hidden="true">
        <img src="../assets/gato-plaquinha.png" alt="" />
      </div>
      <p class="mission-badge" id="mission-badge" hidden></p>
      <button type="button" class="adult-btn" id="adult-btn" aria-label="Controles do adulto. Toque e segure para abrir.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
        <svg class="adult-btn-ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19"/></svg>
      </button>
    </header>

    <p class="stage-instruction" id="stage-instruction" aria-live="polite"></p>

    <main class="stage-center" id="stage-center">

      <section class="panel" data-panel="acolhimento">
        <div class="panel-mascote"><img src="../assets/gatomatematico-sem-fundo.png" alt="" /></div>
        <h1 class="panel-title" id="acolhimento-titulo"></h1>
        <p class="mission-pill" id="acolhimento-missao"></p>
        <p class="panel-fala panel-fala-sm" id="acolhimento-fala"></p>
      </section>

      <section class="panel" data-panel="atividade">
        <div class="mold-slot" id="mold-slot"></div>
      </section>

      <section class="panel" data-panel="feedback">
        <div class="feedback-icon" id="feedback-icon" aria-hidden="true"></div>
        <p class="panel-title panel-title-sm" id="feedback-texto" aria-live="polite"></p>
      </section>

      <section class="panel" data-panel="encerramento">
        <div class="panel-mascote"><img src="../assets/gato-plaquinha.png" alt="" /></div>
        <h1 class="panel-title" id="encerramento-titulo"></h1>
        <p class="panel-fala" id="encerramento-resumo"></p>
      </section>

      <section class="panel" data-panel="pausado">
        <div class="panel-mascote panel-mascote-rest"><img src="../assets/gato-plaquinha.png" alt="" /></div>
        <h1 class="panel-title">Pausado</h1>
        <p class="panel-fala">Sem pressa. Toque em Retomar quando quiser continuar.</p>
      </section>

    </main>

    <footer class="stage-footer" id="stage-footer">
      <button type="button" class="btn-secondary" id="btn-pausar">Pausar</button>
      <button type="button" class="btn-primary" id="btn-principal">Começar</button>
    </footer>

  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <aside class="adult-sheet" id="adult-sheet" aria-hidden="true" aria-label="Controles do adulto">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 class="sheet-title">Controles do adulto</h2>
    <p class="sheet-sub" id="sheet-sub"></p>

    <div class="sheet-actions" id="sheet-actions">
      <button type="button" class="sheet-action" data-adult-action="mais-facil">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Mais fácil
      </button>
      <button type="button" class="sheet-action" data-adult-action="mais-dificil">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        Mais difícil
      </button>
      <button type="button" class="sheet-action" data-adult-action="repetir">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg>
        Repetir instrução
      </button>
      <div class="sheet-sep"></div>
      <button type="button" class="sheet-action" data-adult-action="pausar">
        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        Pausar atividade
      </button>
      <button type="button" class="sheet-action sheet-action-bad" data-adult-action="encerrar">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        Encerrar atividade
      </button>
    </div>

    <div class="sheet-confirm" id="sheet-confirm" hidden>
      <p class="sheet-confirm-title">Essa parte é para o adulto.</p>
      <p class="sheet-confirm-sub">Deseja encerrar a atividade agora? O progresso da rodada atual não fica salvo.</p>
      <div class="sheet-confirm-actions">
        <button type="button" class="btn-secondary" id="sheet-confirm-cancel">Cancelar</button>
        <button type="button" class="btn-primary sheet-confirm-danger" id="sheet-confirm-ok">Sim, encerrar</button>
      </div>
    </div>

    <button type="button" class="sheet-close" id="sheet-close">Fechar</button>
  </aside>

<script type="module" src="../js/pages/modo-crianca.js"></script>
</body>
</html>
